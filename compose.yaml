# Стенд пилота (specs/001-find-lecture-episode, specs/002-slides-letters-schedule,
# specs/003-autonomous-indexer).
# Секреты берутся из .env (образец — .env.example) и передаются только тому
# сервису, которому они нужны.
name: ecoprofi

x-app: &app
  build:
    context: .
    target: app
  image: ecoprofi-app:local
  networks: [internal]

# Образ индексатора: чтение документов и распознавание (Tesseract, русская модель).
x-indexer: &indexer
  build:
    context: .
    target: indexer
  image: ecoprofi-indexer:local
  networks: [internal]

# Окружение индексатора: общее для разовых команд и сервиса indexer-daemon.
# Значения доступа оператора лежат на томе indexer-secrets, а не в окружении.
# Ключ сообщества Экопрофи (CLUB_GROUP_TOKEN) индексатору не передаётся: он только у bot.
x-indexer-env: &indexer-env
  DATABASE_URL: postgresql://ecoprofi_indexer:${INDEXER_DB_PASSWORD}@db:5432/ecoprofi
  YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
  YANDEX_API_KEY: ${YANDEX_API_KEY:-}
  YANDEX_DOC_EMBEDDING_MODEL: ${YANDEX_DOC_EMBEDDING_MODEL:-}
  VK_ID_APP: ${VK_ID_APP:-}
  ACCESS_FILE: /secrets/access.json
  SCHEDULE_URL: ${SCHEDULE_URL:-https://vk.ru/@eco_manager_iso-raspisanie-lekcii-ekobezbez-granic}
  RUN_PORTION: ${RUN_PORTION:-5}
  PERMANENT_AFTER_RUNS: ${PERMANENT_AFTER_RUNS:-3}
  # Платная лента читается доступом оператора; меньше этой доли прежнего объёма — остановка (FR-23).
  PAID_FEED_MIN_RATIO: ${PAID_FEED_MIN_RATIO:-0.5}
  TZ: Europe/Moscow

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ecoprofi
      POSTGRES_USER: ecoprofi_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BOT_DB_PASSWORD: ${BOT_DB_PASSWORD:?задайте BOT_DB_PASSWORD в .env}
      INDEXER_DB_PASSWORD: ${INDEXER_DB_PASSWORD:?задайте INDEXER_DB_PASSWORD в .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoprofi_owner -d ecoprofi"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  bot:
    <<: *app
    command: ["uvicorn", "ecoprofi.bot.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://ecoprofi_bot:${BOT_DB_PASSWORD}@db:5432/ecoprofi
      # Роль владельца схемы нужна только командам migrate и import_policy.
      MIGRATION_DATABASE_URL: postgresql://ecoprofi_owner:${POSTGRES_PASSWORD}@db:5432/ecoprofi
      SERVICE_KEY: ${SERVICE_KEY:?задайте SERVICE_KEY в .env}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_QUERY_EMBEDDING_MODEL: ${YANDEX_QUERY_EMBEDDING_MODEL:-}
      YANDEX_COMPLETION_MODEL: ${YANDEX_COMPLETION_MODEL:-}
      ALERT_STALE_HOURS: ${ALERT_STALE_HOURS:-48}
      # Допуск к поиску — подписка на клуб Экопрофи (VK Donut); ключ сообщества Экопрофи.
      CLUB_GROUP_TOKEN: ${CLUB_GROUP_TOKEN:-}
      CLUB_GROUP_ID: ${CLUB_GROUP_ID:-95098598}
      CLUB_CACHE_SECONDS: ${CLUB_CACHE_SECONDS:-60}
      # Ссылка на оформление подписки в ответе неподписчику; без значения — только текст.
      CLUB_URL: ${CLUB_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  vk-adapter:
    <<: *app
    command: ["python", "-m", "ecoprofi.vk_adapter"]
    environment:
      BOT_URL: http://bot:8000
      SERVICE_KEY: ${SERVICE_KEY}
      VK_GROUP_ID: ${VK_GROUP_ID:-}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN:-}
      # Получатель оповещений оператору; без значения оповещения копятся в БД.
      ALERT_VK_USER_ID: ${ALERT_VK_USER_ID:-}
    depends_on: [bot]
    restart: unless-stopped

  # Разовые команды оператора: docker compose run --rm indexer python -m ecoprofi.indexer ...
  # Вход выполняется один раз командой «access login»; доступ хранится на томе indexer-secrets.
  indexer:
    <<: *indexer
    profiles: [indexer]
    command: ["python", "-m", "ecoprofi.indexer", "status"]
    environment: *indexer-env
    volumes:
      - indexer-secrets:/secrets
    depends_on:
      db:
        condition: service_healthy

  # Плановые обновления утром и вечером: docker compose --profile daemon up -d indexer-daemon
  indexer-daemon:
    <<: *indexer
    profiles: [daemon]
    command: ["python", "-m", "ecoprofi.indexer.daemon"]
    environment: *indexer-env
    volumes:
      - indexer-secrets:/secrets
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Интеграционные проверки: docker compose --profile test run --rm tests
  # Отдельная БД в памяти, рабочий том не затрагивается.
  test-db:
    image: pgvector/pgvector:pg16
    profiles: [test]
    environment:
      POSTGRES_DB: ecoprofi_test
      POSTGRES_USER: ecoprofi_owner
      POSTGRES_PASSWORD: test-owner
      BOT_DB_PASSWORD: test-bot
      INDEXER_DB_PASSWORD: test-indexer
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoprofi_owner -d ecoprofi_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  tests:
    <<: *indexer
    profiles: [test]
    command: ["pytest"]
    environment:
      TEST_OWNER_DATABASE_URL: postgresql://ecoprofi_owner:test-owner@test-db:5432/ecoprofi_test
      TEST_BOT_DATABASE_URL: postgresql://ecoprofi_bot:test-bot@test-db:5432/ecoprofi_test
      TEST_INDEXER_DATABASE_URL: postgresql://ecoprofi_indexer:test-indexer@test-db:5432/ecoprofi_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  db-data:
  # Значения доступа оператора VK: том подключён только к сервисам индексатора.
  indexer-secrets:

networks:
  internal:
