[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecoprofi"
version = "0.1.0"
description = "Поиск материалов цикла «ЭкобезБЕЗграниц» по вопросу участника"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3,<1",
    "httpx>=0.27,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
# Чтение документов и распознавание: только образ индексатора.
indexer = [
    "pypdfium2>=4.30,<6",
    "pytesseract>=0.3.10,<1",
    "Pillow>=10,<13",
    "striprtf>=0.0.26,<1",
]

[tool.setuptools.packages.find]
include = ["ecoprofi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
