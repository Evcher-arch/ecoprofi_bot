# АРХИВ R14: не подключается и не монтируется после возврата к туннелю (R15).
# Для возврата к прямому входу потребуется отдельно пересмотреть доверенные прокси.
# Публичный HTTPS-вход Mini App (004) за проксируемой A-записью Cloudflare.
# Монтируется в /etc/nginx/conf.d/tls/miniapp-tls.conf вместе с сертификатом:
#   ./deploy/certs/origin.pem  — сертификат Cloudflare Origin CA
#   ./deploy/certs/origin.key  — закрытый ключ (секрет, в git не попадает)
# В Cloudflare для записи miniapp.bot-alimony.ru включён режим SSL/TLS Full (strict):
# сертификат Origin CA доверяется только соединению Cloudflare → origin.
server {
    listen 443 ssl;
    http2 on;
    server_name miniapp.bot-alimony.ru;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:miniapp_tls:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/conf.d/miniapp-server.inc;
}
