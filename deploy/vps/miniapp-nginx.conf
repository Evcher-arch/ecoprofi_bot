# Шлюз Mini App на VPS (005): прямой HTTPS без Cloudflare.
# Монтируется compose.vps.yaml поверх /etc/nginx/conf.d/default.conf образа.
# Сертификат Let's Encrypt: /etc/letsencrypt (ro), продление certbot через webroot.
# Адрес участника берётся из TCP-соединения: miniapp-realip.inc не подключается,
# заголовкам CF-Connecting-IP / X-Forwarded-For от клиента не доверяем.
limit_req_zone $binary_remote_addr zone=miniapp:10m rate=10r/s;
limit_req_status 429;

# Access log с URI/query/Authorization не ведётся: в адресе запуска есть подпись.
access_log off;
server_tokens off;

# 80: только ACME-проверка certbot и редирект на HTTPS.
server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://miniapp.bot-alimony.ru$request_uri;
    }
}

# 443 для чужих имён и обращений по IP: обрыв рукопожатия без выдачи сертификата.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    http2 on;
    server_name miniapp.bot-alimony.ru;

    ssl_certificate     /etc/letsencrypt/live/miniapp.bot-alimony.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniapp.bot-alimony.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:miniapp_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/miniapp-server.inc;
}

# 8080: локальная диагностика с хоста (опубликован только на 127.0.0.1).
server {
    listen 8080;
    server_name _;
    include /etc/nginx/conf.d/miniapp-server.inc;
}
