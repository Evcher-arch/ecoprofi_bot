# Альтернатива для локально управляемого именованного туннеля (R15 research.md).
# Основной путь: сервис miniapp-tunnel в Compose и маршрут из кабинета Cloudflare;
# этот YAML основному сервису не нужен. При выборе этого файла запускать cloudflared
# в том же network namespace, что gateway, и монтировать credentials как секрет.
# Нативный запуск Windows потребует отдельной настройки доверенного прокси nginx.
#
# Постоянный HTTPS-вход Mini App (004) через именованный Cloudflare Tunnel.
# Копия с реальным UUID туннеля хранится вне репозитория:
#   %USERPROFILE%\.cloudflared\ecoprofi-miniapp.yml
# Файл учётных данных туннеля (<UUID>.json) — секрет: не копировать в репозиторий и чат.
tunnel: <TUNNEL_UUID>
credentials-file: C:\Users\<USER>\.cloudflared\<TUNNEL_UUID>.json
# Не писать в журнал URI запросов: в адресе запуска Mini App есть подпись.
loglevel: warn
no-autoupdate: true

ingress:
  # Только шлюз nginx (allowlist маршрутов); порт bot наружу не публикуется.
  - hostname: miniapp.bot-alimony.ru
    service: http://127.0.0.1:8080
  - service: http_status:404
