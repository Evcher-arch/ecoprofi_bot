# Публичный шлюз Mini App (004): только production-статика и allowlist /api/miniapp/v1/.
# 8080 — вход от cloudflared и локальная диагностика (только 127.0.0.1 на хосте).
# TLS клиента заканчивается в Cloudflare; до ПК идёт зашифрованный туннель.
limit_req_zone $binary_remote_addr zone=miniapp:10m rate=10r/s;
limit_req_status 429;

# Access log с URI/query/Authorization не ведётся: в адресе запуска есть подпись.
access_log off;

# Реальный адрес клиента за Cloudflare; иначе лимит считался бы на edge-узел.
include /etc/nginx/conf.d/miniapp-realip.inc;

server {
    listen 8080;
    server_name _;
    include /etc/nginx/conf.d/miniapp-server.inc;
}

